<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>F20 Intelligence</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b0d10'/%3E%3Crect x='6' y='9' width='4' height='14' rx='1' fill='%2363b3ff'/%3E%3Crect x='14' y='9' width='4' height='14' rx='1' fill='%232f5fd0'/%3E%3Crect x='22' y='9' width='4' height='14' rx='1' fill='%23e1261c'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="mstripe" aria-hidden="true"><i></i><i></i><i></i></div>
        <div>
          <div class="brand-title">F20 Intelligence</div>
          <div class="brand-sub">116i · N13 · 2012</div>
        </div>
      </div>
      <nav id="nav" aria-label="Module"></nav>
      <div class="sidebar-foot">
        <div class="ro-badge" title="Diese Software enthält keinen Schreibpfad zum Fahrzeug">
          <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M12 2 4 5v6c0 5 3.4 9.7 8 11 4.6-1.3 8-6 8-11V5l-8-3Zm-1 14-4-4 1.4-1.4L11 13.2l4.6-4.6L17 10l-6 6Z"/></svg>
          READ-ONLY
        </div>
        <div class="muted small" id="version"></div>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menü">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
        </button>
        <div>
          <h1 id="pageTitle">Übersicht</h1>
          <div class="muted small" id="pageSub"></div>
        </div>
        <div class="topbar-right">
          <span class="pill" id="sessionPill"><span class="dot"></span><span id="sessionText">Offline</span></span>
        </div>
      </header>
      <section id="view" class="view" tabindex="-1"></section>
    </main>
  </div>
  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head"><h2 id="modalTitle"></h2><button class="icon-btn" id="modalClose" aria-label="Schließen">✕</button></div>
      <div id="modalBody"></div>
    </div>
  </div>
  <div class="toast" id="toast" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
